name: layout-v1.0

# Lays out the Gust N1 v1.0 two-core system on a square die with LibreLane (the same tool the
# Tiny Tapeout flow uses), then publishes a 3D-viewer file into layout/.
on:
  push:
    branches: [main]
    paths: ["v1.0/rtl/**", "v1.0/librelane_config.json", ".github/workflows/layout_v1.0.yaml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-24.04
    timeout-minutes: 345
    env:
      PDK_ROOT: /home/runner/pdk
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install LibreLane and KLayout
        run: pip install librelane==3.0.14 klayout

      - name: Lay out the full chip
        run: |
          mkdir -p runs/full
          python -m librelane --pdk-root "$PDK_ROOT" --docker-no-tty --dockerized \
            --pdk sky130A --run-tag full --force-run-dir runs/full --hide-progress-bar \
            v1.0/librelane_config.json

      - name: Upload run reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: n1-v1.0-reports
          path: |
            runs/full/final/metrics.json
            runs/full/*/*.log
          if-no-files-found: ignore

      - name: Convert layout for the 3D viewer
        if: always() && hashFiles('runs/full/final/gds/n1_soc.gds') != ''
        run: |
          mkdir -p v1.0/layout
          python - <<'EOF'
          import klayout.db as db
          ly = db.Layout()
          ly.read("runs/full/final/gds/n1_soc.gds")
          ly.set_property("TT_PDK", "sky130A")
          ly.write("v1.0/layout/gust_n1_v1.0.oas")
          EOF
          cp runs/full/final/metrics.json v1.0/layout/gust_n1_v1.0_metrics.json
          ls -la v1.0/layout

      - name: Publish layout to the branch
        if: always() && hashFiles('v1.0/layout/gust_n1_v1.0.oas') != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add v1.0/layout
          git commit -m "Gust N1 v1.0 layout from run ${{ github.run_id }} [skip ci]"
          git pull --rebase origin ${{ github.ref_name }}
          git push

      - name: Summary
        run: |
          URL="https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}/v1.0/layout/gust_n1_v1.0.oas"
          {
            echo "# Gust N1 v1.0"
            echo "[Open 3D viewer](https://gds-viewer.tinytapeout.com/?model=${URL}&pdk=sky130A)"
            echo
            echo '```'
            python -c "import json;m=json.load(open('v1.0/layout/gust_n1_v1.0_metrics.json'));[print(k,m[k]) for k in sorted(m) if any(s in k for s in ('design__instance__count','design__instance__utilization','timing__setup__ws','timing__hold__ws','route__drc_errors','antenna__violating'))]"
            echo '```'
          } >> $GITHUB_STEP_SUMMARY
